name = "ai-video-studio-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Your app's address (no trailing slash). Add more separated by commas.
ALLOWED_ORIGINS = "https://izzahb07.github.io"
# Optional: switch transcription to Groq (cheaper) by uncommenting:
# TRANSCRIBE_BASE_URL = "https://api.groq.com/openai/v1"
# TRANSCRIBE_MODEL = "whisper-large-v3-turbo"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put APP_PASSCODE
#   npx wrangler secret put TRANSCRIBE_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
