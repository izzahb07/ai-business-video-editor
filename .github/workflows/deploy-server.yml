# OPTIONAL: deploys the AI server (server/) to Cloudflare Workers.
# Runs only when you press "Run workflow" in the Actions tab. Keys come from
# GitHub secrets (Settings → Secrets and variables → Actions) and are stored as
# encrypted Cloudflare secrets — never in the app or the repository.
name: Deploy AI server (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first (see server/README.md)."; exit 1; fi
          if [ -z "${{ secrets.APP_PASSCODE }}" ]; then echo "::error::Add an APP_PASSCODE repository secret."; exit 1; fi
      - name: Deploy worker
        run: npx wrangler deploy
      - name: Store secrets in Cloudflare
        env:
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
          TRANSCRIBE_API_KEY: ${{ secrets.TRANSCRIBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for name in APP_PASSCODE TRANSCRIBE_API_KEY ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; else echo "Skipping $name (not set)"; fi
          done
